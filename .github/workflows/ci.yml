name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: syntax
        run: bash -n src/kvm-autofit install.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning src/kvm-autofit install.sh || true
          shellcheck -S error src/kvm-autofit install.sh
      - name: smoke
        run: |
          ./src/kvm-autofit --version
          ./install.sh --dry-run
